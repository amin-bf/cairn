[package]
name = "slice-core"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "slice_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
slice-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
