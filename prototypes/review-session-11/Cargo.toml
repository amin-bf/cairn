# Standalone workspace: keeps this throwaway crate out of the repo root package.
[workspace]

[package]
name = "review-session-11"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
egui = "0.35"
unicode-bidi = "0.3.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# eframe's default features include accesskit, which eframe rejects together with
# android-native-activity. So the dependency is split per target, same as prototypes/egui-slice.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.35"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android-activity = "0.6"
winit = "0.30"
eframe = { version = "0.35", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "android-native-activity",
] }

[lib]
name = "review_session_11"
crate-type = ["lib", "cdylib"]

# cargo-apk packaging (NativeActivity — no Java/Kotlin in the APK), same shape as
# prototypes/egui-slice's proven setup (see #7's toolchain proof).
[package.metadata.android]
package = "dev.leitner.reviewsession11"
build_targets = ["aarch64-linux-android"]
apk_name = "review-session-11"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[package.metadata.android.application]
label = "review session · #11"

[package.metadata.android.signing.release]
path = "/home/amin/.android/debug.keystore"
keystore_password = "android"
