[package]
name = "fsrsbench-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

# A separate crate from the cdylib on purpose: one crate carrying both a cdylib and a
# bin makes `cargo-apk` exit non-zero after signing (AGENTS.md, client-stack rule 5).
[[bin]]
name = "fsrsbench"
path = "src/main.rs"

[dependencies]
fsrsbench = { path = "../core" }
