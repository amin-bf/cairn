# Standalone workspace: keeps this throwaway crate out of the repo root package.
[workspace]

[package]
name = "egui-slice"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
unicode-bidi = "0.3.18"

# eframe's default features include accesskit, which eframe rejects together with
# android-native-activity. So the dependency is split per target.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.35"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemWritableFileStream",
  "FileSystemCreateWritableOptions",
  "File",
  "Blob",
  "Document",
  "HtmlCanvasElement",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android-activity = "0.6"
winit = "0.30"
# Back to NativeActivity. GameActivity was tried and reverted: it implements IME properly, but
# winit 0.30's Android backend never reads it (only MotionEvent and KeyEvent are handled), so the
# capability is unreachable. It cost a Gradle project, an AAR, a 5.7 MB classes.dex and a Kotlin
# version conflict, for nothing. See android/README.md.
eframe = { version = "0.35", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "android-native-activity",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

[lib]
name = "egui_slice"
crate-type = ["lib", "cdylib"]

# cargo-apk packaging (NativeActivity — no Java/Kotlin in the APK)
[package.metadata.android]
package = "dev.leitner.eguislice"
build_targets = ["aarch64-linux-android"]
apk_name = "egui-slice"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[package.metadata.android.application]
label = "egui slice"

[package.metadata.android.signing.release]
path = "/home/amin/.android/debug.keystore"
keystore_password = "android"
