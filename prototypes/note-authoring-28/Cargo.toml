# Standalone workspace: keeps this throwaway crate out of the repo root package.
[workspace]

# #67: one line of `egui-winit` disabled on Android — see `vendor/egui-winit/src/lib.rs`. Vendored
# rather than worked around in app code because the defect is two layers below anything we control:
# every tap into a text field re-pops the soft keyboard, and there is no hook between egui's
# platform output and `egui-winit`'s handling of it.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[package]
name = "note-authoring-28"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
egui = "0.35"
unicode-bidi = "0.3.18"

# eframe's default features include accesskit, which eframe rejects together with
# android-native-activity. So the dependency is split per target, same as prototypes/egui-slice.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.35"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android-activity = "0.6"
winit = "0.30"
eframe = { version = "0.35", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "android-native-activity",
] }

[lib]
name = "note_authoring_28"
crate-type = ["lib", "cdylib"]

# cargo-apk packaging (NativeActivity — no Java/Kotlin in the APK), same shape as
# prototypes/review-session-11's proven setup (see #7's toolchain proof).
[package.metadata.android]
package = "dev.leitner.noteauthoring28"
build_targets = ["aarch64-linux-android"]
apk_name = "note-authoring-28"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[package.metadata.android.application]
label = "note authoring · #28"

[package.metadata.android.signing.release]
path = "/home/amin/.android/debug.keystore"
keystore_password = "android"
