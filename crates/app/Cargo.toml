[package]
name = "cairn-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The desktop application's library; the binary is `crates/desktop`. `res/` beside this file is the
# launcher icon the Kotlin app bundles (`android/app/build.gradle.kts`), not a resource of this crate.

[dependencies]
cairn-core.workspace = true
cairn-store.workspace = true
cairn-export.workspace = true
cairn-ops.workspace = true
egui.workspace = true
unicode-bidi.workspace = true
# Pinned exactly for the same reason `egui` is (ADR-0026 §3): the egui family moves together, and a
# floating requirement here is a route to resolving `eframe` past the `egui` it was built against.
eframe = "=0.35.0"

[dev-dependencies]
# The session and deck logic is tested against a real store in a temp dir (there is no fake store).
tempfile.workspace = true
