[package]
name = "cairn-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cairn-core.workspace = true
cairn-store.workspace = true
cairn-export.workspace = true
egui.workspace = true
unicode-bidi.workspace = true

[dev-dependencies]
# The session and deck logic is tested against a real store in a temp dir (there is no fake store).
tempfile.workspace = true

# ADR-0003 §5: eframe's default features include accesskit, which eframe refuses alongside
# android-native-activity. So the dependency is split per target — this is not tidiness, the
# unified form does not build for Android.
#
# Both arms are pinned exactly for the same reason `egui` is (ADR-0026 §3): `eframe` is what pulls
# `egui-winit` in, so a floating requirement here is a route to resolving the family past the
# version the vendored copy was diffed against.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "=0.35.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
winit.workspace = true
jni.workspace = true
ndk-context.workspace = true
eframe = { version = "=0.35.0", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "android-native-activity",
] }

# ADR-0003 §5: `cargo-apk` panics after signing (`Bin is not compatible with Cdylib`) when one crate
# has both a cdylib and a bin. So this crate has NO src/main.rs — the desktop binary is
# `crates/desktop`, and adding a `[[bin]]` here breaks CI.
[lib]
name = "cairn_app"
crate-type = ["lib", "cdylib"]

# cargo-apk packaging: NativeActivity, so the APK is a manifest plus a `.so` — no Java, no Kotlin,
# no Gradle project in the repository (ADR-0003 §2). GameActivity was tried and reverted in #8.
[package.metadata.android]
package = "dev.cairn.app"
build_targets = ["aarch64-linux-android"]
apk_name = "cairn"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[package.metadata.android.application]
label = "Cairn"

# Inbound deck files (ADR-0024 §2, issue #89). A `.cdeck` arriving through a file manager or a
# messaging app carries a `content://` URI with a **row id** in the path and no filename, and
# `MediaStore` types both profiles `application/octet-stream` — so a filter can match neither the
# extension nor a precise media type on the routes that matter. The **broad** octet-stream filter is
# the only inbound door; the file is then identified by sniffing its `mimetype` member, never its
# name (ADR-0024 §1), and refused honestly if it is not ours. No `path_pattern` is declared — the
# filter never matches on the extension (ADR-0024 §2), which is what the deck-export rules require.
#
# The **precise** filter is kept because it costs nothing and a phone-to-phone share declaring our
# own type (ADR-0023 §3) matches it without the broad one.
#
# NativeActivity has one activity, so these attach to it. **Verify against the *emitted*
# `AndroidManifest.xml`, never this source** — `cargo-apk` can drop escapes, and there is no JDK or
# device in this sandbox to package or run the APK. On-device arrival is issue #99 (a handset
# ticket blocked by #89), under AGENTS.md rule 9.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/octet-stream"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/vnd.cairn.deck+zip"
