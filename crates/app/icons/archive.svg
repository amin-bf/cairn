<!-- **Drawn for the file list (#167), not taken from the sixteen**, which have no picture for a
     collection archive. A lidded box with a slot: the thing a whole collection is packed into, in
     the set's own language — the 24px grid, the 1.5 stroke, round caps and joins. It accompanies the
     words *collection archive* and never replaces them (ADR-0041 §4). -->
