[package]
name = "cairn-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The desktop binaries' home. It was split out of `cairn-app` for the egui Android build's packager
# (ADR-0003 §5), which is retired (ADR-0045 §8); it stays because the scripts, captures and docs run
# `-p cairn-desktop`, and a shim costs nothing. Keep it one: logic belongs in `cairn-app`, where the
# tests reach it.
#
# It depends on `cairn-app` and nothing else — `eframe` arrives by re-export. That is not
# tidiness: a direct `eframe` here could resolve different features from the ones `cairn-app` was
# built with, and it would give this crate a way to grow real code without anyone noticing.
[dependencies]
cairn-app.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

# The fixture bench's outside way in (issue #153). It is a second binary rather than a flag on the
# first because it must run **while the app is not**: it unlinks the databases and their `-wal`
# siblings, which a live connection would be left checkpointing into. Declared here beside `cairn`
# rather than left to autodiscovery, so the two are visible in one place.
[[bin]]
name = "cairn-fixture"
path = "src/bin/fixture.rs"
