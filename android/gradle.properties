org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# The JDK Gradle's toolchain compiles with (the newest installed; scripts/android-env.sh points JAVA_HOME
# at the same one) and the bytecode target, which stops at 24, the newest JVM target Kotlin 2.2.10 knows.
cairn.jdk=27
cairn.bytecode=24
android.nonTransitiveRClass=true
