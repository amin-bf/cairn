[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/store",
  "crates/export",
  "crates/sync",
  "crates/ops",
  "crates/ffi",
  "crates/app",
  "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Dependency versions live here so the crates cannot drift apart.
[workspace.dependencies]
cairn-core = { path = "crates/core" }
cairn-store = { path = "crates/store" }
cairn-export = { path = "crates/export" }
cairn-ops = { path = "crates/ops" }
cairn-app = { path = "crates/app" }

# `fsrs` is `cairn-core`'s one dependency (ADR-0027 §1), pinned exactly per ADR-0001 §1: the 6.x
# line shipped nine releases in eleven days with breaking API changes inside the major version, so
# the pin is a requirement, not caution. Declared here for the same reason every other version is —
# so the crates cannot drift apart — even though only `cairn-core` depends on it.
fsrs = "=6.6.1"

# Pinned exactly, with `eframe` in `crates/app` (ADR-0026 §3, on ADR-0001 §2's precedent): the egui
# family moves together, and the desktop is judged against one version of it.
egui = "=0.35.0"
rusqlite = { version = "0.40", features = ["bundled"] }
getrandom = "0.3"
tempfile = "3"

# ADR-0013 §4 fixes `zstd` as the compressor for published objects, and ADR-0004 §11 (as amended by
# ADR-0013 §12) pins level 19 as the ratio the decade projection assumes. It is a container, not a
# re-encoding, so the exact interchange bytes come back out. Only `cairn-sync` publishes objects,
# so only it depends on this; declared here so the version cannot drift. Like `rusqlite bundled` it
# compiles C, so an Android build needs the NDK's clang exported (`scripts/android-env.sh`).
zstd = "0.13"

# `eframe` is declared in `crates/app` alone, its one user; `crates/desktop` gets it by re-export
# rather than by dependency, which is what keeps that crate a shim.
unicode-bidi = "0.3.18"

# ADR-0008 §2 fixes the deck container as a zip archive, and the feature flags there are the working
# ones: `--no-default-features --features deflate-flate2-zlib-rs`. The umbrella `deflate` feature
# builds but drags in zopfli, and `deflate-flate2` alone selects no zlib backend and fails to
# compile. Only `cairn-export` builds the container, so only it depends on this; declared here so
# the version cannot drift.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# ADR-0046 §2: only `cairn-ffi` depends on this. Pinned exactly — the Kotlin runtime the generator
# emits is matched to the Rust scaffolding by version, and the spike measured 0.32.2
# (docs/research/kotlin-binding/README.md). Declared without `cli`: the generator is host-only and
# `cairn-ffi` turns it on behind a feature the Android build leaves off.
uniffi = "=0.32.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
