[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/store",
  "crates/export",
  "crates/sync",
  "crates/app",
  "crates/desktop",
]
# The vendored adapter is third-party source we carry, not a crate of ours (ADR-0026 §3). It is
# reached only through `[patch.crates-io]` below, so it is never built as a member and never
# inherits `[workspace.package]`.
exclude = ["vendor/egui-winit"]

# ADR-0026 §3: `egui-winit` is carried as a **verbatim copy of the published 0.35.0**, with one
# block — the per-tap IME-composition interrupt — behind `#[cfg(not(target_os = "android"))]`. On
# Android that block dismisses and reopens the soft keyboard on every tap into a text field, for a
# composition that platform can never produce, and the inset collapse it causes throws away the
# scroll position ADR-0025 §1 exists to make meaningful. There is no fix above the dependency: the
# interrupt flag is private, its setter public and its clearer not, and nothing hooks the platform
# output before this crate reads it.
#
# A *fork* was rejected rather than merely not chosen: the crate as published depends on `egui` from
# the registry, but inside its own repository on a workspace path — so a fork pulls a second copy of
# `egui` into the graph beside the one `eframe` and our crates use, whose types would not unify.
#
# **Bumping this is not just a version change.** See `vendor/PATCH.md` and
# `scripts/verify-vendor.sh`: recursive diff against a pristine copy, then the block-shape check —
# and if a release restructures the block, re-judge rather than re-apply.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Dependency versions live here so the five crates cannot drift apart. The Android set is pinned to
# the versions proven on the handset in #7 and #8 — see docs/environment/android-toolchain.md.
[workspace.dependencies]
cairn-core = { path = "crates/core" }
cairn-store = { path = "crates/store" }
cairn-export = { path = "crates/export" }
cairn-app = { path = "crates/app" }

# `fsrs` is `cairn-core`'s one dependency (ADR-0027 §1), pinned exactly per ADR-0001 §1: the 6.x
# line shipped nine releases in eleven days with breaking API changes inside the major version, so
# the pin is a requirement, not caution. Declared here for the same reason every other version is —
# so the crates cannot drift apart — even though only `cairn-core` depends on it.
fsrs = "=6.6.1"

# Pinned exactly, adapter and toolkit together (ADR-0026 §3, on ADR-0001 §2's precedent). The
# vendored `egui-winit` above is one published version with one block guarded, and it declares an
# ordinary `egui = 0.35.0` dependency — so a floating requirement here could resolve the family onto
# a release the vendored copy was never diffed against, silently.
egui = "=0.35.0"
rusqlite = { version = "0.40", features = ["bundled"] }
getrandom = "0.3"
tempfile = "3"

# ADR-0013 §4 fixes `zstd` as the compressor for published objects, and ADR-0004 §11 (as amended by
# ADR-0013 §12) pins level 19 as the ratio the decade projection assumes. It is a container, not a
# re-encoding, so the exact interchange bytes come back out. Only `cairn-sync` publishes objects,
# so only it depends on this; declared here so the version cannot drift. Like `rusqlite bundled` it
# compiles C, so an Android build needs the NDK's clang exported (`scripts/android-env.sh`).
zstd = "0.13"

# `eframe` is deliberately absent. Its two arms disagree on `default-features` (ADR-0003 §5), and a
# workspace entry cannot be overridden that way — so both arms are declared literally in
# `crates/app`, side by side in one file where they cannot drift apart. `crates/desktop` gets it by
# re-export rather than by dependency, which is what keeps that crate a shim.
unicode-bidi = "0.3.18"

# ADR-0008 §2 fixes the deck container as a zip archive, and the feature flags there are the working
# ones: `--no-default-features --features deflate-flate2-zlib-rs`. The umbrella `deflate` feature
# builds but drags in zopfli, and `deflate-flate2` alone selects no zlib backend and fails to
# compile. Only `cairn-export` builds the container, so only it depends on this; declared here so
# the version cannot drift.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

android-activity = "0.6"
jni = "0.21"
ndk-context = "0.1"
winit = "0.30"

[profile.release]
opt-level = "z"
lto = true
strip = true
